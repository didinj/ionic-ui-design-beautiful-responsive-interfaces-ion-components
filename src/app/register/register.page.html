<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Create Account</h1>

  <p>Enter your information to create your account.</p>

  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <ion-item>
      <ion-input
        label="Full Name"
        labelPlacement="floating"
        formControlName="name"
      >
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="email"
        label="Email"
        labelPlacement="floating"
        formControlName="email"
      >
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="password"
        label="Password"
        labelPlacement="floating"
        formControlName="password"
      >
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-select
        label="Country"
        labelPlacement="floating"
        formControlName="country"
      >
        <ion-select-option value="id"> Indonesia </ion-select-option>

        <ion-select-option value="sg"> Singapore </ion-select-option>

        <ion-select-option value="my"> Malaysia </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-checkbox slot="start" formControlName="terms"> </ion-checkbox>

      <ion-label> I agree to the terms and conditions. </ion-label>
    </ion-item>

    <ion-button type="submit" expand="block" shape="round">
      Create Account
    </ion-button>
  </form>
</ion-content>
