<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" sizeSm="6" sizeLg="4">
        <ion-card>
          <img src="assets/images/product-1.jpg" alt="Wireless headphones" />

          <ion-card-header>
            <ion-card-title> Wireless Headphones </ion-card-title>
          </ion-card-header>

          <ion-card-content> $79.99 </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeSm="6" sizeLg="4">
        <ion-card>
          <img src="assets/images/product-2.jpg" alt="Smart watch" />

          <ion-card-header>
            <ion-card-title> Smart Watch </ion-card-title>
          </ion-card-header>

          <ion-card-content> $129.99 </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeSm="6" sizeLg="4">
        <ion-card>
          <img src="assets/images/product-3.jpg" alt="Bluetooth speaker" />

          <ion-card-header>
            <ion-card-title> Bluetooth Speaker </ion-card-title>
          </ion-card-header>

          <ion-card-content> $59.99 </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
